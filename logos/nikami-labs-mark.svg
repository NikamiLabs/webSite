<svg width="100%" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Nikami Labs — "Cut" mark (N-diagonal)</title>
<desc>Rounded square with a diagonal channel cut from top-left to bottom-right, echoing the diagonal stroke of the letter N without spelling it out literally.</desc>

<defs>
  <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#15304F"/>
    <stop offset="1" stop-color="#0B1524"/>
  </linearGradient>

  <mask id="cutMask" maskUnits="userSpaceOnUse">
    <rect x="0" y="0" width="340" height="340" fill="white"/>
    <rect x="-100" y="148" width="540" height="44" fill="black" transform="rotate(45 170 170)"/>
  </mask>

  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1524" flood-opacity="0.18"/>
  </filter>
</defs>

<rect x="20" y="20" width="300" height="300" rx="20" fill="#FCFCFB" stroke="#0B0B0B" stroke-opacity="0.08" stroke-width="0.75"/>
<g filter="url(#softShadow)">
  <rect x="70" y="70" width="200" height="200" rx="44" fill="url(#navyGrad)" mask="url(#cutMask)"/>
</g>

</svg>
